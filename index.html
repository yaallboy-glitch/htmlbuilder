<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>D'Londong — Music Player</title>
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
<script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #0b0c10;
    --card: rgba(255,255,255,.045);
    --card-hover: rgba(255,255,255,.07);
    --border: rgba(255,255,255,.09);
    --text: #f1f1f3;
    --dim: #9096a1;
    --faint: #565b64;
    --accent: #5eead4;
    --accent-dim: rgba(94,234,212,.15);
  }
  html, body { height: 100%; overflow-x: hidden; }
  body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at 20% 0%, #14171d 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
    width: 100%;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(10px, 3vw, 32px);
  }
  .ico { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  .ico svg { width: 1em; height: 1em; flex-shrink: 0; }
  .ico.dim svg { opacity: .5; }

  .app {
    width: 100%;
    max-width: 980px;
    min-width: 0;
    margin-top: clamp(4px, 2vh, 24px);
  }

  /* HEADER */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px; padding: 0 4px;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: clamp(34px, 8vw, 38px); height: clamp(34px, 8vw, 38px); border-radius: 12px;
    background: var(--card); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); font-size: clamp(15px, 4vw, 18px);
    flex-shrink: 0;
  }
  .brand h1 { font-size: clamp(15px, 4vw, 17px); font-weight: 700; letter-spacing: -.2px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: clamp(10.5px, 2.6vw, 12px); color: var(--dim); font-weight: 500; }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); transition: background .3s; flex-shrink: 0; }
  .status .dot.on { background: var(--accent); box-shadow: 0 0 6px var(--accent); }

  /* LAYOUT */
  .layout { display: grid; grid-template-columns: 1fr; gap: 14px; min-width: 0; }
  .layout .main, .layout .sidebar { min-width: 0; }
  @media (min-width: 620px) and (max-width: 959px) {
    /* TABLET: kartu tetap ringkas & center, jangan melebar penuh */
    .app { max-width: 480px; }
  }
  @media (min-width: 960px) {
    /* DESKTOP / PC: sidebar sits beside the player */
    .layout { grid-template-columns: 1fr 320px; align-items: start; }
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 18px;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    min-width: 0;
  }

  /* UPLOAD */
  .upload-zone {
    border: 1.5px dashed var(--border);
    border-radius: 16px;
    padding: 18px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
    transition: all .2s ease;
    color: var(--dim);
  }
  .upload-zone:hover, .upload-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-dim);
    color: var(--text);
  }
  .upload-zone .ico { font-size: 18px; }
  .upload-zone span.txt { font-size: 13.5px; font-weight: 500; }
  .upload-zone span.txt b { color: var(--text); font-weight: 600; }
  .hint { font-size: 10.5px; color: var(--faint); text-align: center; margin-top: 6px; }
  input[type="file"] { display: none; }

  /* PLAYER */
  .player { display: flex; flex-direction: column; gap: 16px; margin-top: 14px; min-width: 0; }

  .cover {
    width: 100%; aspect-ratio: 16/8; max-height: clamp(140px, 32vw, 220px);
    border-radius: 16px;
    background: linear-gradient(160deg, rgba(94,234,212,.08), rgba(255,255,255,.02));
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .cover .placeholder { font-size: 44px; color: var(--faint); }
  .cover .spectrum {
    position: absolute; bottom: 0; left: 0; right: 0; height: 56px;
    display: flex; align-items: flex-end; justify-content: center; gap: 2px;
    padding: 0 10px; opacity: 0; transition: opacity .4s ease;
  }
  .cover .spectrum.active { opacity: 1; }
  .cover .spectrum .bar {
    width: 3px; background: var(--accent); border-radius: 1px;
    opacity: .55; min-height: 2px; transition: height .06s ease;
  }

  .song-info { text-align: center; min-width: 0; max-width: 100%; }
  .song-info .title {
    font-size: clamp(15.5px, 4.2vw, 18px); font-weight: 700; color: var(--text);
    overflow: hidden; white-space: nowrap; min-width: 0; max-width: 100%;
    position: relative;
  }
  .song-info .title .marquee-track { display: inline-block; will-change: transform; }
  .song-info .title.marquee .marquee-track {
    animation: marqueeScroll var(--marquee-duration, 8s) ease-in-out infinite alternate;
  }
  @keyframes marqueeScroll {
    0%, 12% { transform: translateX(0); }
    88%, 100% { transform: translateX(var(--marquee-distance, 0px)); }
  }
  .song-info .artist {
    font-size: clamp(11.5px, 3vw, 12.5px); color: var(--dim); margin-top: 4px; min-height: 16px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; max-width: 100%; min-width: 0;
  }

  .progress-wrap { display: flex; align-items: center; gap: 10px; }
  .progress-wrap .time { font-size: 11px; color: var(--faint); min-width: 34px; font-variant-numeric: tabular-nums; }
  .progress-wrap .time:last-child { text-align: right; }
  .progress-bar {
    flex: 1; height: 5px; background: rgba(255,255,255,.08);
    border-radius: 3px; position: relative; cursor: pointer;
  }
  .progress-bar .fill { height: 100%; width: 0%; background: var(--accent); border-radius: 3px; }

  .controls { display: flex; align-items: center; justify-content: center; gap: clamp(12px, 4vw, 18px); }
  .controls .btn {
    width: clamp(38px, 10vw, 44px); height: clamp(38px, 10vw, 44px); border-radius: 50%;
    border: 1px solid var(--border); background: var(--card);
    color: var(--dim); font-size: clamp(14px, 3.6vw, 16px); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease; flex-shrink: 0;
  }
  .controls .btn:hover:not(:disabled) { background: var(--card-hover); color: var(--text); }
  .controls .btn:active:not(:disabled) { transform: scale(.92); }
  .controls .btn:disabled { opacity: .3; cursor: not-allowed; }
  .controls .btn.play {
    width: clamp(48px, 13vw, 56px); height: clamp(48px, 13vw, 56px); font-size: clamp(17px, 4.5vw, 20px);
    background: var(--accent); border-color: var(--accent); color: #04211c;
  }
  .controls .btn.play:hover:not(:disabled) { filter: brightness(1.08); }
  .controls .btn.loop-on { color: var(--accent); border-color: var(--accent); }

  .bottom-row {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding-top: 12px; border-top: 1px solid var(--border);
  }
  .volume { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 130px; }
  .volume .ico { color: var(--faint); font-size: 14px; }
  .volume input[type="range"] {
    flex: 1; height: 4px; -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,.1); border-radius: 3px; outline: none;
  }
  .volume input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px;
    background: var(--accent); border-radius: 50%; cursor: pointer;
  }
  select#eqSelect, select#modeSelect {
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    font-size: 12px; font-weight: 500; padding: 7px 10px; border-radius: 8px;
    cursor: pointer; outline: none;
  }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  .actions .btn-sm {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--card);
    color: var(--dim); cursor: pointer; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .actions .btn-sm:hover { background: var(--card-hover); color: var(--text); }

  .status-text {
    font-size: 11.5px; color: var(--faint); text-align: center;
    min-height: 14px;
  }

  /* SIDEBAR / PLAYLIST */
  .sidebar-title {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .sidebar-title span:first-child { font-size: 13px; font-weight: 700; }
  .sidebar-title .count { font-size: 11px; color: var(--faint); }
  .playlist { display: flex; flex-direction: column; gap: 4px; max-height: 380px; overflow-y: auto; }
  .playlist::-webkit-scrollbar { width: 4px; }
  .playlist::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }

  .playlist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; border-radius: 12px;
    border: 1px solid transparent;
    cursor: pointer; transition: all .15s ease;
  }
  .playlist-item:hover { background: var(--card-hover); }
  .playlist-item.active { background: var(--accent-dim); border-color: rgba(94,234,212,.3); }
  .playlist-item .idx { font-size: 11px; font-weight: 600; color: var(--faint); min-width: 16px; }
  .playlist-item .info { flex: 1; min-width: 0; }
  .playlist-item .info .name {
    font-size: 13px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .playlist-item.active .info .name { color: var(--accent); }
  .playlist-item .info .meta { font-size: 10.5px; color: var(--faint); margin-top: 1px; }
  .playlist-item .pl-status { width: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .pl-del {
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
    border: none; background: transparent; color: var(--faint);
    font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .pl-del:hover { background: rgba(248,113,113,.15); color: #f87171; }

  /* spinner render kecil */
  .spin {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.15);
    border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* bar "now playing" */
  .eq-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
  .eq-bars i { width: 2.5px; background: var(--accent); border-radius: 1px; animation: eqBounce 1s ease-in-out infinite; }
  .eq-bars i:nth-child(1) { height: 40%; animation-delay: 0s; }
  .eq-bars i:nth-child(2) { height: 100%; animation-delay: .2s; }
  .eq-bars i:nth-child(3) { height: 60%; animation-delay: .4s; }
  @keyframes eqBounce { 0%,100% { transform: scaleY(.4); } 50% { transform: scaleY(1); } }

  .playlist-empty { font-size: 12px; color: var(--faint); text-align: center; padding: 34px 0; }
  .playlist-empty .ico { font-size: 26px; display: block; margin: 0 auto 8px; opacity: .4; }

  /* TOAST */
  .toast-wrap {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 9999; display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; max-width: 92vw;
  }
  .toast-item {
    padding: 9px 16px; border-radius: 12px; font-size: 12.5px; font-weight: 500;
    background: rgba(15,16,20,.95); backdrop-filter: blur(14px);
    border: 1px solid var(--border); color: var(--text);
    animation: toastIn .25s ease, toastOut .25s ease 2.6s forwards;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    display: flex; align-items: center; gap: 8px;
  }
  .toast-item.ok { border-color: rgba(94,234,212,.35); }
  .toast-item.err { border-color: rgba(248,113,113,.35); }
  @keyframes toastIn { from { opacity:0; transform: translateY(-10px); } to { opacity:1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; transform: translateY(-8px); } }

  @media (max-width: 480px) {
    .card { padding: 14px; border-radius: 16px; }
    .bottom-row { justify-content: center; }
    .actions { margin-left: 0; }
    select#eqSelect, select#modeSelect { flex: 1 1 auto; min-width: 0; }
  }
  @media (min-width: 481px) and (max-width: 959px) {
    .card { padding: 16px; }
  }
  @media (min-width: 960px) {
    .card { padding: 20px; }
    .cover { max-height: 240px; }
  }
</style>
</head>
<body>

<div class="toast-wrap" id="toastWrap"></div>

<div class="app">
  <header class="header">
    <div class="brand">
      <div class="logo"><span class="ico" data-icon="headphones"></span></div>
      <h1>D'Londong</h1>
    </div>
    <div class="status">
      <span class="dot" id="statusDot"></span>
      <span id="statusLabel">Siap</span>
    </div>
  </header>

  <div class="layout">
    <!-- MAIN -->
    <div class="main">
      <div class="card">
        <div class="upload-zone" id="uploadZone">
          <span class="ico dim" data-icon="upload"></span>
          <span class="txt"><b>Tap atau tarik</b> file audio ke sini</span>
        </div>
        <div class="hint" id="storageHint">Tersimpan otomatis di browser ini — tetap ada walau di-refresh</div>
        <input type="file" id="fileInput" accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.opus" multiple>

        <div class="player">
          <div class="cover" id="coverArt">
            <span class="ico dim placeholder" id="coverIcon" data-icon="disc"></span>
            <div class="spectrum" id="spectrum"></div>
          </div>

          <div class="song-info">
            <div class="title" id="songTitle"><span class="marquee-track" id="songTitleTrack">Belum ada lagu</span></div>
            <div class="artist" id="songArtist">Upload audio untuk mulai</div>
          </div>

          <div class="progress-wrap">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar"><div class="fill" id="progressFill"></div></div>
            <span class="time" id="totalTime">0:00</span>
          </div>

          <div class="controls">
            <button class="btn" id="prevBtn" disabled><span class="ico" data-icon="skipBack"></span></button>
            <button class="btn play" id="playBtn" disabled><span class="ico" id="playIcon" data-icon="play"></span></button>
            <button class="btn" id="nextBtn" disabled><span class="ico" data-icon="skipForward"></span></button>
            <button class="btn" id="loopBtn"><span class="ico" data-icon="repeat"></span></button>
          </div>

          <div class="bottom-row">
            <div class="volume">
              <span class="ico" data-icon="volumeLow"></span>
              <input type="range" id="volumeSlider" min="0" max="100" value="80">
            </div>
            <select id="eqSelect">
              <option value="flat">EQ: Flat</option>
              <option value="rock">EQ: Rock</option>
              <option value="pop">EQ: Pop</option>
              <option value="jazz">EQ: Jazz</option>
              <option value="bass">EQ: Bass</option>
              <option value="vocal">EQ: Vocal</option>
            </select>
            <select id="modeSelect" title="Mode audio">
              <option value="stereo">🎧 Stereo</option>
              <option value="mono">🔊 Mono</option>
              <option value="8d">🌀 8D Audio</option>
            </select>
            <div class="actions">
              <button class="btn-sm" id="downloadBtn" title="Download hasil studio"><span class="ico" data-icon="download"></span></button>
              <button class="btn-sm" id="resetBtn" title="Reset"><span class="ico" data-icon="trash"></span></button>
            </div>
          </div>

          <div class="status-text" id="statusText">Siap memutar audio</div>
        </div>
      </div>
    </div>

    <!-- SIDEBAR -->
    <div class="sidebar">
      <div class="card">
        <div class="sidebar-title">
          <span>Playlist</span>
          <span class="count" id="playlistCount">0 lagu</span>
        </div>
        <div class="playlist" id="playlist"></div>
      </div>
    </div>
  </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
// ============================================================
// IMPORTS
// ============================================================
const FFmpeg = (typeof FFmpegWASM !== 'undefined' && FFmpegWASM.FFmpeg) ? FFmpegWASM.FFmpeg : null;
const toBlobURL = (typeof FFmpegUtil !== 'undefined' && FFmpegUtil.toBlobURL) ? FFmpegUtil.toBlobURL : null;
const fetchFile = (typeof FFmpegUtil !== 'undefined' && FFmpegUtil.fetchFile) ? FFmpegUtil.fetchFile : null;
const ffmpegLibAvailable = !!(FFmpeg && toBlobURL && fetchFile);

// ============================================================
// ICONS
// ============================================================
const ICON_PATHS = {
  headphones: '<path d="M3 18v-6a9 9 0 0 1 18 0v6"></path><rect x="1" y="15" width="4.5" height="7" rx="1.5"></rect><rect x="18.5" y="15" width="4.5" height="7" rx="1.5"></rect>',
  upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line>',
  disc: '<circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="2.5"></circle>',
  skipBack: '<polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line>',
  skipForward: '<polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line>',
  repeat: '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>',
  volumeLow: '<polygon points="10 5 5 9 1 9 1 15 5 15 10 19 10 5"></polygon><path d="M15 8.5a5 5 0 0 1 0 7"></path>',
  download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line>',
  trash: '<polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>',
  checkCircle: '<path d="M22 11.1V12a10 10 0 1 1-5.9-9.1"></path><polyline points="22 4 12 14.1 9 11.1"></polyline>',
  alertCircle: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>',
  inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>'
};
function icon(name, extraClass) {
  const cls = extraClass ? ' ' + extraClass : '';
  if (name === 'play') return `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>`;
  if (name === 'pause') return `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>`;
  const body = ICON_PATHS[name] || '';
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${body}</svg>`;
}
function initIcons(root) {
  (root || document).querySelectorAll('[data-icon]').forEach(el => {
    el.innerHTML = icon(el.getAttribute('data-icon'));
  });
}

// ============================================================
// DOM REFS
// ============================================================
const $ = id => document.getElementById(id);
const uploadZone = $('uploadZone');
const fileInput = $('fileInput');
const coverArt = $('coverArt');
const coverIcon = $('coverIcon');
const spectrum = $('spectrum');
const songTitle = $('songTitle');
const songTitleTrack = $('songTitleTrack');
const songArtist = $('songArtist');
const statusLabel = $('statusLabel');
const statusDot = $('statusDot');
const playBtn = $('playBtn');
const playIcon = $('playIcon');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const loopBtn = $('loopBtn');
const progressBar = $('progressBar');
const progressFill = $('progressFill');
const currentTime = $('currentTime');
const totalTime = $('totalTime');
const volumeSlider = $('volumeSlider');
const eqSelect = $('eqSelect');
const modeSelect = $('modeSelect');
const statusText = $('statusText');
const audioPlayer = $('audioPlayer');
const playlist = $('playlist');
const playlistCount = $('playlistCount');
const downloadBtn = $('downloadBtn');
const resetBtn = $('resetBtn');

// ============================================================
// STATE
// ============================================================
let items = [];
let currentIndex = -1;
let currentUrl = null;
let isPlaying = false;
let isLooping = false;
let isReady = false;
let ffmpeg = null;
let currentEQ = 'flat';
let audioContext = null;
let analyser = null;
let dataArray = null;
let animationId = null;
let spectrumBars = [];
let autoConvertQueue = [];
let isAutoConverting = false;
let ffmpegLogBuffer = [];
let currentRenderName = '';
let currentMode = 'stereo';
let sourceNode = null;
let splitterNode = null, monoGainL = null, monoGainR = null, mergerNode = null;
let pannerNode = null;
let panLFO = null, panLFOGain = null;
let volumeGainNode = null;
let audioGraphReady = false;

const EQ_PRESETS = {
  flat: { low: 0, mid: 0, high: 0 },
  rock: { low: 4, mid: -2, high: 3 },
  pop: { low: -1, mid: 2, high: 2 },
  jazz: { low: 3, mid: 1, high: -1 },
  bass: { low: 6, mid: -2, high: -1 },
  vocal: { low: -2, mid: 4, high: 1 }
};

// ============================================================
// PENYIMPANAN LOKAL (IndexedDB) — playlist tetap ada walau di-refresh
// ============================================================
const DB_NAME = 'dlondong-sound-db';
const DB_VERSION = 1;
const STORE_NAME = 'tracks';
let dbPromise = null;

function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB tidak didukung')); return; }
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbPut(record) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(id) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbClear() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function makeId() {
  return (crypto.randomUUID ? crypto.randomUUID() : 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2));
}
let warnedStorageFull = false;
function savePersisted(item) {
  return dbPut({
    id: item.dbId,
    name: item.name,
    size: item.size,
    duration: item.duration,
    sampleRate: item.sampleRate,
    isStudio: item.isStudio,
    originalBlob: item.isStudio ? null : item.file,
    studioBlob: item.blob || null,
    addedAt: item.addedAt || Date.now()
  }).catch(err => {
    console.warn('Gagal menyimpan track ke penyimpanan lokal:', err);
    if (!warnedStorageFull) {
      warnedStorageFull = true;
      toast('Penyimpanan lokal penuh/terbatas — lagu tetap diputar tapi tidak tersimpan permanen', 'err');
    }
  });
}
async function loadPersistedTracks() {
  let tracks = [];
  try { tracks = await dbGetAll(); } catch (e) { return; }
  if (!tracks.length) return;
  tracks.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
  for (const t of tracks) {
    const blobForFile = t.studioBlob || t.originalBlob;
    if (!blobForFile) continue;
    const item = {
      dbId: t.id,
      file: blobForFile,
      name: t.name,
      size: t.size,
      duration: t.duration,
      sampleRate: t.sampleRate,
      blob: t.studioBlob || null,
      url: t.studioBlob ? URL.createObjectURL(t.studioBlob) : null,
      rawUrl: t.studioBlob ? null : URL.createObjectURL(t.originalBlob),
      isStudio: !!t.studioBlob,
      addedAt: t.addedAt || Date.now()
    };
    items.push(item);
    if (!item.isStudio) queueAutoConvert(items.length - 1);
  }
  renderPlaylist();
  if (items.length) {
    currentIndex = 0;
    const first = items[0];
    const src = (first.isStudio && first.url) ? first.url : first.rawUrl;
    currentUrl = src;
    audioPlayer.src = src;
    audioPlayer.load();
    updateUI(first);
    bindAudioEvents();
    toast('Playlist tersimpan dimuat kembali (' + items.length + ' lagu)', 'ok');
  }
}

function toast(msg, type = 'info') {
  const wrap = $('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast-item ' + type;
  const iconName = { ok: 'checkCircle', err: 'alertCircle', info: 'alertCircle' };

// ============================================================
// FORMAT
// ============================================================
function formatSize(b) {
  if (b < 1024) return b + 'B';
  if (b < 1048576) return (b / 1024).toFixed(1) + 'KB';
  return (b / 1048576).toFixed(1) + 'MB';
}
function formatDuration(s) {
  s = Math.floor(s || 0);
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ':' + (sec < 10 ? '0' + sec : sec);
}

// ============================================================
// SONG TITLE MARQUEE — biar teks panjang gak ngerubah ukuran layout
// ============================================================
function setSongTitle(text) {
  songTitleTrack.textContent = text;
  songTitle.classList.remove('marquee');
  songTitleTrack.style.setProperty('--marquee-distance', '0px');
  requestAnimationFrame(() => {
    const overflow = songTitleTrack.scrollWidth - songTitle.clientWidth;
    if (overflow > 2) {
      const distance = overflow + 4;
      const duration = Math.max(4, Math.min(16, distance / 28));
      songTitleTrack.style.setProperty('--marquee-distance', (-distance) + 'px');
      songTitleTrack.style.setProperty('--marquee-duration', duration + 's');
      songTitle.classList.add('marquee');
    }
  });
}
window.addEventListener('resize', () => setSongTitle(songTitleTrack.textContent));

// ============================================================
// GET AUDIO INFO
// ============================================================
async function getAudioInfo(file) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const buf = await file.arrayBuffer();
    const audioBuffer = await ctx.decodeAudioData(buf);
    await ctx.close();
    return { duration: audioBuffer.duration, sampleRate: audioBuffer.sampleRate };
  } catch (e) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      const audio = new Audio();
      audio.preload = 'metadata';
      audio.onloadedmetadata = () => { URL.revokeObjectURL(url); resolve({ duration: audio.duration || 0, sampleRate: 44100 }); };
      audio.onerror = () => { URL.revokeObjectURL(url); resolve({ duration: 0, sampleRate: 44100 }); };
      setTimeout(() => { URL.revokeObjectURL(url); resolve({ duration: 0, sampleRate: 44100 }); }, 4000);
      audio.src = url;
    });
  }
}

// ============================================================
// SPECTRUM
// ============================================================
function initSpectrum() {
  spectrum.innerHTML = '';
  spectrumBars = [];
  for (let i = 0; i < 32; i++) {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '2px';
    spectrum.appendChild(bar);
    spectrumBars.push(bar);
  }
}
function startSpectrum() {
  setupAudioGraph();
  if (audioContext && audioContext.state === 'suspended') audioContext.resume().catch(() => {});
  spectrum.classList.add('active');
  animateSpectrum();
}

// ============================================================
// AUDIO GRAPH — Stereo / Mono / 8D
// ============================================================
function setupAudioGraph() {
  if (audioGraphReady) return;
  try {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);

    sourceNode = audioContext.createMediaElementSource(audioPlayer);

    // node untuk downmix Mono (L+R digabung, dikirim rata ke kedua channel)
    splitterNode = audioContext.createChannelSplitter(2);
    mergerNode = audioContext.createChannelMerger(2);
    monoGainL = audioContext.createGain(); monoGainL.gain.value = 0.5;
    monoGainR = audioContext.createGain(); monoGainR.gain.value = 0.5;

    // node untuk pan Stereo / 8D
    pannerNode = audioContext.createStereoPanner();

    // gain node khusus buat volume — audio.volume bawaan tidak reliabel
    // begitu elemen audio disambungkan ke Web Audio graph
    volumeGainNode = audioContext.createGain();
    volumeGainNode.gain.value = volumeSlider.value / 100;

    volumeGainNode.connect(analyser);
    analyser.connect(audioContext.destination);
    audioGraphReady = true;
    audioPlayer.volume = 1; // volume sekarang dikontrol lewat volumeGainNode, bukan elemen <audio>
    applyAudioMode(currentMode);
  } catch (e) {
    // fallback: kalau Web Audio gagal, biarkan audio tetap jalan native
    console.error(e);
  }
}

function applyAudioMode(mode) {
  currentMode = mode;
  if (!audioGraphReady) return;

  stopPanLFO();
  try { sourceNode.disconnect(); } catch (e) {}
  try { splitterNode.disconnect(); } catch (e) {}
  try { monoGainL.disconnect(); } catch (e) {}
  try { monoGainR.disconnect(); } catch (e) {}
  try { mergerNode.disconnect(); } catch (e) {}
  try { pannerNode.disconnect(); } catch (e) {}

  pannerNode.pan.cancelScheduledValues(audioContext.currentTime);
  pannerNode.pan.setValueAtTime(0, audioContext.currentTime);

  if (mode === 'mono') {
    sourceNode.connect(splitterNode);
    splitterNode.connect(monoGainL, 0);
    splitterNode.connect(monoGainR, 1);
    monoGainL.connect(mergerNode, 0, 0);
    monoGainL.connect(mergerNode, 0, 1);
    monoGainR.connect(mergerNode, 0, 0);
    monoGainR.connect(mergerNode, 0, 1);
    mergerNode.connect(pannerNode);
  } else {
    sourceNode.connect(pannerNode);
  }
  pannerNode.connect(volumeGainNode);

  if (mode === '8d') startPanLFO();
}

function startPanLFO() {
  stopPanLFO();
  panLFO = audioContext.createOscillator();
  panLFO.type = 'sine';
  panLFO.frequency.value = 0.13; // ~1 putaran tiap 7-8 detik, khas efek 8D
  panLFOGain = audioContext.createGain();
  panLFOGain.gain.value = 0.9; // ayun antar -0.9 s/d 0.9 biar tidak mentok mati sebelah
  panLFO.connect(panLFOGain);
  panLFOGain.connect(pannerNode.pan);
  panLFO.start();
}

function stopPanLFO() {
  if (panLFO) { try { panLFO.stop(); panLFO.disconnect(); } catch (e) {} panLFO = null; }
  if (panLFOGain) { try { panLFOGain.disconnect(); } catch (e) {} panLFOGain = null; }
}
function animateSpectrum() {
  if (!analyser) return;
  analyser.getByteFrequencyData(dataArray);
  const step = Math.floor(dataArray.length / spectrumBars.length);
  for (let i = 0; i < spectrumBars.length; i++) {
    const val = dataArray[i * step] || 0;
    spectrumBars[i].style.height = Math.max(2, (val / 255) * 48) + 'px';
  }
  animationId = requestAnimationFrame(animateSpectrum);
}
function stopSpectrum() {
  spectrum.classList.remove('active');
  if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
  spectrumBars.forEach(b => b.style.height = '2px');
}

// ============================================================
// RENDER PLAYLIST
// ============================================================
function renderPlaylist() {
  prevBtn.disabled = items.length < 2;
  nextBtn.disabled = items.length < 2;
  if (!items.length) {
    playlist.innerHTML = `<div class="playlist-empty"><span class="ico">${icon('inbox')}</span><span>Belum ada lagu</span></div>`;
    playlistCount.textContent = '0 lagu';
    return;
  }
  playlistCount.textContent = items.length + ' lagu';
  playlist.innerHTML = items.map((it, i) => {
    const active = i === currentIndex ? 'active' : '';
    const playing = i === currentIndex && isPlaying;
    const rendering = !it.isStudio;
    let statusHtml = '';
    if (playing) statusHtml = '<span class="eq-bars"><i></i><i></i><i></i></span>';
    else if (rendering) statusHtml = '<span class="spin" title="Merender lossless..."></span>';
    return `
      <div class="playlist-item ${active}" onclick="playFromPlaylist(${i})">
        <span class="idx">${i + 1}</span>
        <div class="info">
          <div class="name">${it.name}</div>
          <div class="meta">${formatSize(it.size)} · ${formatDuration(it.duration)}</div>
        </div>
        <span class="pl-status">${statusHtml}</span>
        <button class="pl-del" onclick="removeTrack(${i}, event)" title="Hapus">×</button>
      </div>
    `;
  }).join('');
}

// ============================================================
// ADD FILES
// ============================================================
async function addFiles(files) {
  const allowed = ['audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/flac', 'audio/mp4', 'audio/aac', 'audio/opus'];
  for (const file of files) {
    if (!allowed.includes(file.type) && !file.name.match(/\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i)) {
      toast('Format tidak didukung: ' + file.name, 'err');
      continue;
    }
    const info = await getAudioInfo(file);
    const item = {
      dbId: makeId(),
      file: file,
      name: file.name.replace(/\.[^.]+$/, ''),
      size: file.size,
      duration: info.duration || 0,
      sampleRate: info.sampleRate || 44100,
      blob: null,
      url: null,
      rawUrl: URL.createObjectURL(file), // langsung bisa diputar, tak perlu tunggu render
      isStudio: false,
      addedAt: Date.now()
    };
    items.push(item);
    toast('+ ' + file.name, 'ok');
    renderPlaylist();
    savePersisted(item);
    queueAutoConvert(items.length - 1);
  }
  if (currentIndex === -1 && items.length) {
    currentIndex = 0;
    await loadItem(0);
  }
  renderPlaylist();
}

// ============================================================
// AUTO-CONVERT QUEUE (render lossless di background)
// ============================================================
function queueAutoConvert(index) {
  autoConvertQueue.push(index);
  processAutoConvertQueue();
}
async function processAutoConvertQueue() {
  if (isAutoConverting || !isReady) return;
  isAutoConverting = true;
  while (autoConvertQueue.length) {
    const idx = autoConvertQueue.shift();
    const it = items[idx];
    if (it && !it.isStudio) await convertItemToStudio(idx);
  }
  isAutoConverting = false;
}

// ============================================================
// LOAD ITEM
// ============================================================
async function loadItem(index) {
  if (index < 0 || index >= items.length) return;
  const it = items[index];
  currentIndex = index;

  const src = (it.isStudio && it.url) ? it.url : (it.rawUrl || (it.rawUrl = URL.createObjectURL(it.file)));
  if (currentUrl && currentUrl !== src) URL.revokeObjectURL(currentUrl);
  currentUrl = src;
  audioPlayer.src = currentUrl;
  audioPlayer.load();

  updateUI(it);
  renderPlaylist();
  bindAudioEvents();
}

function updateUI(it) {
  setSongTitle(it.name);
  coverIcon.innerHTML = icon('headphones');
  coverIcon.style.fontSize = '38px';
  playBtn.disabled = false;
  if (it.isStudio) {
    songArtist.textContent = (it.sampleRate / 1000).toFixed(0) + 'kHz · ' + formatSize(it.size) + ' · Studio lossless';
  } else {
    songArtist.textContent = (it.sampleRate || 44100) + 'Hz · ' + formatSize(it.size) + ' · merender lossless...';
  }
}

// ============================================================
// PLAY FROM PLAYLIST / PREV / NEXT
// ============================================================
function playFromPlaylist(index) {
  if (index === currentIndex && isPlaying) { togglePlay(); return; }
  if (index === currentIndex && audioPlayer.src) { audioPlayer.play().catch(() => {}); return; }
  loadAndPlay(index);
}
function loadAndPlay(index) {
  loadItem(index);
  setTimeout(() => audioPlayer.play().catch(() => {}), 200);
}
function playPrev() {
  if (items.length < 2) return;
  loadAndPlay((currentIndex - 1 + items.length) % items.length);
}
function playNext() {
  if (items.length < 2) return;
  loadAndPlay((currentIndex + 1) % items.length);
}

function removeTrack(index, evt) {
  if (evt) evt.stopPropagation();
  const it = items[index];
  if (!it) return;
  if (it.url) URL.revokeObjectURL(it.url);
  if (it.rawUrl) URL.revokeObjectURL(it.rawUrl);
  if (it.dbId) dbDelete(it.dbId).catch(() => {});
  const wasCurrent = index === currentIndex;
  items.splice(index, 1);
  if (wasCurrent) {
    audioPlayer.pause();
    audioPlayer.removeAttribute('src');
    audioPlayer.load();
    currentUrl = null;
    if (items.length) {
      currentIndex = Math.min(index, items.length - 1);
      loadItem(currentIndex);
    } else {
      currentIndex = -1;
      setSongTitle('Belum ada lagu');
      songArtist.textContent = 'Upload audio untuk mulai';
      playBtn.disabled = true;
      playIcon.innerHTML = icon('play');
      progressFill.style.width = '0%';
      currentTime.textContent = '0:00';
      totalTime.textContent = '0:00';
      coverIcon.innerHTML = icon('disc');
      coverIcon.style.fontSize = '44px';
      stopSpectrum();
    }
  } else if (index < currentIndex) {
    currentIndex--;
  }
  renderPlaylist();
  toast('Dihapus dari playlist', 'info');
}

// ============================================================
// AUDIO EVENTS
// ============================================================
function bindAudioEvents() {
  audioPlayer.onplay = () => {
    isPlaying = true;
    playIcon.innerHTML = icon('pause');
    if (!spectrum.classList.contains('active')) { initSpectrum(); startSpectrum(); }
    renderPlaylist();
  };
  audioPlayer.onpause = () => {
    isPlaying = false;
    playIcon.innerHTML = icon('play');
    renderPlaylist();
  };
  audioPlayer.ontimeupdate = () => {
    if (audioPlayer.duration) {
      progressFill.style.width = (audioPlayer.currentTime / audioPlayer.duration * 100) + '%';
      currentTime.textContent = formatDuration(audioPlayer.currentTime);
    }
  };
  audioPlayer.onloadedmetadata = () => {
    totalTime.textContent = formatDuration(audioPlayer.duration);
    progressFill.style.width = '0%';
    currentTime.textContent = '0:00';
  };
  audioPlayer.onended = () => {
    if (isLooping) { audioPlayer.currentTime = 0; audioPlayer.play(); return; }
    if (items.length > 1 && currentIndex < items.length - 1) { playNext(); return; }
    playIcon.innerHTML = icon('play');
    stopSpectrum();
    renderPlaylist();
  };
  audioPlayer.onerror = () => toast('Error memutar audio', 'err');
  volumeSlider.oninput = () => {
    const v = volumeSlider.value / 100;
    if (volumeGainNode) {
      volumeGainNode.gain.setTargetAtTime(v, audioContext.currentTime, 0.01);
    } else {
      audioPlayer.volume = v;
    }
  };
  audioPlayer.volume = volumeSlider.value / 100;
  progressBar.onclick = (e) => {
    if (!audioPlayer.duration) return;
    const rect = progressBar.getBoundingClientRect();
    audioPlayer.currentTime = ((e.clientX - rect.left) / rect.width) * audioPlayer.duration;
  };
}

// ============================================================
// CAPTURE FFMPEG LOGS
// ============================================================
function captureFFmpegLogs() {
  ffmpeg.on('log', ({ message }) => {
    ffmpegLogBuffer.push(message);
    if (ffmpegLogBuffer.length > 400) ffmpegLogBuffer.shift();
  });
  ffmpeg.on('progress', ({ progress }) => {
    const pct = Math.min(100, Math.round((progress || 0) * 100));
    setStatus(`Merender ${pct}% — ${currentRenderName}`, 'info');
  });

// ============================================================
// MEASURE LOUDNESS
// ============================================================
async function measureLoudness(inputName, preFilter) {
  const startLen = ffmpegLogBuffer.length;
  try {
    await ffmpeg.exec(['-i', inputName, '-af', preFilter + 'loudnorm=I=-16:TP=-1.5:LRA=14:print_format=json', '-f', 'null', '-']);
  } catch (e) {}
  const logs = ffmpegLogBuffer.slice(startLen).join('\n');
  const match = logs.match(/\{[\s\S]*?\}/);
  if (!match) return null;
  try { return JSON.parse(match[0]); } catch (e) { return null; }
}

// ============================================================
// CONVERT ITEM TO STUDIO (lossless render — jalan di background)
// ============================================================
async function convertItemToStudio(index) {
  const it = items[index];
  if (!it || !ffmpeg) return;
  const isCurrent = index === currentIndex;

  currentRenderName = it.name;
  setStatus('Merender lossless: ' + it.name, 'info');
  renderPlaylist();

  const inputName = `in_${index}_${Date.now()}`;
  const outputName = `out_${index}_${Date.now()}.wav`;

  try {
    const info = await getAudioInfo(it.file);
    const outSr = Math.max(48000, info.sampleRate || 44100);
    const eq = EQ_PRESETS[currentEQ] || EQ_PRESETS.flat;
    const eqActive = eq.low !== 0 || eq.mid !== 0 || eq.high !== 0;
    const preFilter = eqActive
      ? `bass=g=${eq.low}:f=320,equalizer=g=${eq.mid}:f=1000:width_type=q:w=1,treble=g=${eq.high}:f=3200,`
      : '';

    await ffmpeg.writeFile(inputName, await fetchFile(it.file));
    const measured = await measureLoudness(inputName, preFilter);

    const loudnormStage = measured
      ? `loudnorm=I=-16:TP=-1.5:LRA=14:measured_I=${measured.input_i}:measured_TP=${measured.input_tp}:measured_LRA=${measured.input_lra}:measured_thresh=${measured.input_thresh}:offset=${measured.target_offset}:linear=true:print_format=summary`
      : `loudnorm=I=-16:TP=-1.5:LRA=14`;

    const filter = [
      preFilter.replace(/,$/, ''),
      loudnormStage,
      `aresample=${outSr}:filter_size=512:cutoff=0.999:phase_shift=10`,
      `alimiter=limit=0.98:attack=3:release=50`
    ].filter(Boolean).join(',');

    await ffmpeg.exec(['-i', inputName, '-af', filter, '-map_metadata', '-1', '-fflags', '+bitexact', '-c:a', 'pcm_f32le', '-ar', String(outSr), '-y', outputName]);
    const data = await ffmpeg.readFile(outputName);
    const blob = new Blob([data.buffer], { type: 'audio/wav' });
    const outInfo = await getAudioInfo(blob);

    const oldItemUrl = it.url;
    it.blob = blob;
    it.isStudio = true;
    it.url = URL.createObjectURL(blob);
    it.sampleRate = outSr;
    it.size = blob.size;
    it.duration = outInfo.duration || it.duration;

    if (isCurrent) {
      const wasPlaying = !audioPlayer.paused;
      const resumeAt = audioPlayer.currentTime || 0;
      if (currentUrl && currentUrl !== it.url) URL.revokeObjectURL(currentUrl);
      currentUrl = it.url;
      audioPlayer.src = currentUrl;
      audioPlayer.load();
      if (wasPlaying) { audioPlayer.currentTime = resumeAt; audioPlayer.play().catch(() => {}); }
      updateUI(it);
    } else if (oldItemUrl) {
      URL.revokeObjectURL(oldItemUrl);
    }
    if (it.rawUrl) { URL.revokeObjectURL(it.rawUrl); it.rawUrl = null; }
    savePersisted(it);

    toast('✅ ' + it.name + ' — lossless siap', 'ok');
    setStatus('Siap memutar audio', 'ok');
    renderPlaylist();
    await ffmpeg.deleteFile(inputName).catch(() => {});
    await ffmpeg.deleteFile(outputName).catch(() => {});
  } catch (e) {
    toast('Gagal render ' + it.name, 'err');
    setStatus('Gagal merender: ' + it.name, 'err');
    renderPlaylist();
    console.error(e);
  }
}

// ============================================================
// DOWNLOAD
// ============================================================
function downloadAudio() {
  const it = items[currentIndex];
  if (!it || !it.isStudio || !it.blob) { toast('Belum ada hasil render untuk diunduh', 'info'); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(it.blob);
  a.download = it.name + '_Studio.wav';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Download dimulai', 'ok');
}

// ============================================================
// RESET
// ============================================================
function resetPlayer() {
  if (!confirm('Reset pemutar? Semua lagu di playlist (termasuk yang tersimpan di browser ini) akan dihapus permanen.')) return;
  items.forEach(it => {
    if (it.url) URL.revokeObjectURL(it.url);
    if (it.rawUrl) URL.revokeObjectURL(it.rawUrl);
  });
  dbClear().catch(() => {});
  items = [];
  autoConvertQueue = [];
  currentIndex = -1;
  currentUrl = null;
  audioPlayer.src = '';
  audioPlayer.load();
  setSongTitle('Belum ada lagu');
  songArtist.textContent = 'Upload audio untuk mulai';
  playBtn.disabled = true;
  playIcon.innerHTML = icon('play');
  progressFill.style.width = '0%';
  currentTime.textContent = '0:00';
  totalTime.textContent = '0:00';
  coverIcon.innerHTML = icon('disc');
  coverIcon.style.fontSize = '44px';
  stopSpectrum();
  setStatus('Reset selesai', 'info');
  toast('Reset', 'info');
  renderPlaylist();
  isLooping = false;
  loopBtn.classList.remove('loop-on');
  modeSelect.value = 'stereo';
  applyAudioMode('stereo');
}

// ============================================================
// UPLOAD EVENTS
// ============================================================
uploadZone.addEventListener('click', () => fileInput.click());
uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
uploadZone.addEventListener('drop', e => {
  e.preventDefault();
  uploadZone.classList.remove('dragover');
  if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) addFiles(fileInput.files);
  fileInput.value = '';
});

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  if (e.key === 'ArrowRight') audioPlayer.currentTime = Math.min(audioPlayer.currentTime + 10, audioPlayer.duration || 0);
  if (e.key === 'ArrowLeft') audioPlayer.currentTime = Math.max(audioPlayer.currentTime - 10, 0);
  if (e.key === 'l' || e.key === 'L') loopBtn.click();
});

// ============================================================
// INIT
// ============================================================
(async function init() {
  initIcons();
  initSpectrum();
  setSongTitle(songTitleTrack.textContent);
  renderPlaylist();
  await loadPersistedTracks();
  bootFFmpeg();
})();

window.addEventListener('beforeunload', e => {
  if (items.length) { e.preventDefault(); e.returnValue = ''; }
});
</script>
</body>
