<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aurora Player — High Quality Music</title>
    
    <!-- FFmpeg WASM -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ===== ROOT ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #7c5cff;
            --secondary: #21d4fd;
            --accent: #ff7eb6;
            --bg: #0a0a12;
            --glass: rgba(255,255,255,.04);
            --border: rgba(255,255,255,.06);
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e4e4e7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
            overflow-x: hidden;
        }
        /* ===== BACKGROUND ANIMASI ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background: 
                radial-gradient(ellipse 800px 600px at 15% 20%, rgba(124,92,255,.12), transparent 60%),
                radial-gradient(ellipse 600px 600px at 85% 80%, rgba(33,212,253,.10), transparent 55%),
                radial-gradient(ellipse 500px 400px at 50% 50%, rgba(124,92,255,.06), transparent 50%);
            animation: floatBg 18s ease-in-out infinite alternate;
        }
        @keyframes floatBg {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(20px, -20px) scale(1.05); }
            100% { transform: translate(-10px, 10px) scale(0.95); }
        }
        
        /* ===== PARTIKEL ===== */
        .particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(124,92,255,.3);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }
        @keyframes particleFloat {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ===== CONTAINER ===== */
        .player-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            background: rgba(19,24,56,.6);
            backdrop-filter: blur(32px) saturate(180%);
            -webkit-backdrop-filter: blur(32px) saturate(180%);
            border: 1px solid rgba(255,255,255,.07);
            border-radius: 28px;
            padding: 28px 24px 24px;
            box-shadow: 
                0 30px 80px -20px rgba(0,0,0,.8),
                0 0 0 1px rgba(124,92,255,.06) inset,
                0 1px 0 0 rgba(255,255,255,.05) inset;
            transition: all .3s ease;
        }
        .player-container:hover {
            border-color: rgba(124,92,255,.15);
            box-shadow: 0 30px 80px -20px rgba(124,92,255,.15), 0 0 0 1px rgba(124,92,255,.08) inset;
        }

        /* ===== HEADER ===== */
        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .player-brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 4px 16px rgba(124,92,255,.3);
            animation: logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%, 100% { box-shadow: 0 4px 16px rgba(124,92,255,.3); }
            50% { box-shadow: 0 4px 30px rgba(124,92,255,.5); }
        }
        .player-brand h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .player-brand h1 span {
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .player-brand .version {
            font-size: 8px;
            font-weight: 600;
            color: #52525b;
            background: rgba(255,255,255,.04);
            padding: 2px 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.06);
        }
        .player-quality {
            font-size: 9px;
            font-weight: 700;
            color: #4ade80;
            background: rgba(52,211,153,.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(52,211,153,.15);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .player-quality i {
            font-size: 7px;
        }

        /* ===== UPLOAD ZONE ===== */
        .upload-zone {
            border: 2px dashed rgba(255,255,255,.1);
            border-radius: 16px;
            padding: 28px 16px;
            text-align: center;
            cursor: pointer;
            transition: all .3s ease;
            background: rgba(255,255,255,.02);
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .upload-zone:hover {
            border-color: rgba(124,92,255,.4);
            background: rgba(124,92,255,.04);
        }
        .upload-zone.dragover {
            border-color: var(--primary);
            background: rgba(124,92,255,.08);
            transform: scale(1.01);
        }
        .upload-zone .icon {
            font-size: 32px;
            opacity: .3;
            margin-bottom: 4px;
            transition: all .3s;
        }
        .upload-zone:hover .icon {
            opacity: .6;
            transform: translateY(-2px);
        }
        .upload-zone .title {
            font-size: 13px;
            font-weight: 600;
            color: #a1a1aa;
        }
        .upload-zone .title b {
            color: #e4e4e7;
        }
        .upload-zone .sub {
            font-size: 10px;
            color: #52525b;
            margin-top: 2px;
        }
        .upload-zone .formats {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .upload-zone .formats span {
            font-size: 8px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.04);
            color: #71717a;
        }
        input[type="file"] { display: none; }

        /* ===== FILE INFO ===== */
        .file-info {
            display: none;
            padding: 10px 14px;
            background: rgba(255,255,255,.03);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,.04);
            margin-bottom: 14px;
            font-size: 11px;
            color: #a1a1aa;
            animation: slideDown .3s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .file-info .row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
        }
        .file-info .row .label { color: #71717a; }
        .file-info .row .value { color: #e4e4e7; font-weight: 600; }

        /* ===== COVER ===== */
        .cover-art {
            width: 100%;
            aspect-ratio: 1/1;
            max-height: 300px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,.6);
            border: 1px solid rgba(255,255,255,.04);
            transition: all .3s;
        }
        .cover-art .placeholder {
            font-size: 64px;
            opacity: .15;
            transition: all .5s;
        }
        .cover-art .placeholder i {
            animation: iconPulse 4s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .cover-art .spectrum {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 3px;
            padding: 0 10px;
            opacity: 0;
            transition: opacity .5s ease;
        }
        .cover-art .spectrum.active {
            opacity: 1;
        }
        .cover-art .spectrum .bar {
            width: 4px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: height .1s ease;
            min-height: 2px;
            box-shadow: 0 0 10px rgba(124,92,255,.2);
        }

        /* ===== SONG TITLE ===== */
        .song-info {
            text-align: center;
            margin-bottom: 12px;
        }
        .song-info .title {
            font-size: 18px;
            font-weight: 700;
            color: #e4e4e7;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-info .title i {
            font-size: 12px;
            opacity: .3;
        }
        .song-info .artist {
            font-size: 12px;
            color: #71717a;
            margin-top: 2px;
        }
        .song-info .status-badge {
            display: inline-block;
            font-size: 8px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            margin-top: 4px;
            background: rgba(124,92,255,.1);
            color: #a78bfa;
            border: 1px solid rgba(124,92,255,.1);
        }
        .song-info .status-badge.playing {
            background: rgba(52,211,153,.1);
            color: #4ade80;
            border-color: rgba(52,211,153,.15);
            animation: statusPulse 1.5s ease-in-out infinite;
        }
        @keyframes statusPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .5; }
        }

        /* ===== CONTROLS ===== */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 12px 0 10px;
        }
        .controls .ctrl-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            background: rgba(255,255,255,.04);
            color: #a1a1aa;
            font-size: 14px;
            cursor: pointer;
            transition: all .2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,.06);
        }
        .controls .ctrl-btn:hover {
            background: rgba(255,255,255,.08);
            color: #e4e4e7;
            transform: translateY(-2px);
        }
        .controls .ctrl-btn:active {
            transform: scale(.94);
        }
        .controls .ctrl-btn.play-btn {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            font-size: 18px;
            border: none;
            box-shadow: 0 4px 20px rgba(124,92,255,.3);
        }
        .controls .ctrl-btn.play-btn:hover {
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 6px 30px rgba(124,92,255,.4);
        }
        .controls .ctrl-btn.play-btn:active {
            transform: scale(.94);
        }
        .controls .ctrl-btn:disabled {
            opacity: .3;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== PROGRESS ===== */
        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 4px 0 6px;
        }
        .progress-wrap .time {
            font-size: 10px;
            font-variant-numeric: tabular-nums;
            color: #71717a;
            min-width: 34px;
        }
        .progress-wrap .time:first-child { text-align: right; }
        .progress-wrap .time:last-child { text-align: left; }
        .progress-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,.06);
            border-radius: 2px;
            position: relative;
            cursor: pointer;
            transition: height .2s;
        }
        .progress-bar:hover {
            height: 6px;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 2px;
            transition: width .05s linear;
            position: relative;
        }
        .progress-bar .fill::after {
            content: '';
            position: absolute;
            right: -5px;
            top: -3px;
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            transition: opacity .2s;
            box-shadow: 0 0 12px rgba(124,92,255,.4);
        }
        .progress-bar:hover .fill::after {
            opacity: 1;
        }

        /* ===== VOLUME & QUALITY ===== */
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,.04);
        }
        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }
        .volume-wrap i {
            font-size: 12px;
            color: #71717a;
        }
        .volume-wrap input[type="range"] {
            flex: 1;
            max-width: 80px;
            height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,.08);
            border-radius: 2px;
            outline: none;
        }
        .volume-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(124,92,255,.3);
        }
        .volume-wrap input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: var(--primary);
            border-radius: 50%;
            cursor: pointer;
            border: none;
        }
        .bottom-actions {
            display: flex;
            gap: 6px;
        }
        .bottom-actions .btn {
            padding: 4px 10px;
            border-radius: 6px;
            border: none;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            transition: all .2s;
            background: rgba(255,255,255,.04);
            color: #a1a1aa;
            border: 1px solid rgba(255,255,255,.06);
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .bottom-actions .btn:hover {
            background: rgba(255,255,255,.08);
            color: #e4e4e7;
        }
        .bottom-actions .btn.primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #fff;
            border: none;
        }
        .bottom-actions .btn.primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(124,92,255,.3);
        }
        .bottom-actions .btn.danger {
            background: rgba(248,113,113,.08);
            color: #f87171;
            border-color: rgba(248,113,113,.15);
        }
        .bottom-actions .btn.danger:hover {
            background: rgba(248,113,113,.15);
        }

        /* ===== STATUS ===== */
        .status-text {
            font-size: 9px;
            color: #52525b;
            text-align: center;
            margin-top: 10px;
            min-height: 14px;
        }
        .status-text i {
            margin-right: 4px;
        }
        .status-text .ok { color: #4ade80; }
        .status-text .err { color: #f87171; }
        .status-text .info { color: #60a5fa; }

        /* ===== TOAST ===== */
        .toast-wrap {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 6px;
            pointer-events: none;
        }
        .toast-item {
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(10,10,12,.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,.06);
            color: #e4e4e7;
            animation: toastIn .3s ease, toastOut .3s ease 2.8s forwards;
            pointer-events: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast-item .icon { font-size: 13px; }
        .toast-item.ok .icon { color: #4ade80; }
        .toast-item.err .icon { color: #f87171; }
        .toast-item.info .icon { color: #60a5fa; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-8px); }
        }

        /* ===== RESPONSIVE ===== */
        @media(max-width:480px) {
            .player-container { padding: 16px; border-radius: 20px; }
            .player-brand h1 { font-size: 15px; }
            .player-quality { font-size: 8px; padding: 2px 8px; }
            .controls .ctrl-btn { width: 34px; height: 34px; font-size: 12px; }
            .controls .ctrl-btn.play-btn { width: 44px; height: 44px; font-size: 16px; }
            .song-info .title { font-size: 15px; }
            .cover-art .placeholder { font-size: 40px; }
            .bottom-actions .btn { font-size: 8px; padding: 3px 8px; }
            .volume-wrap input[type="range"] { max-width: 60px; }
        }
    </style>
</head>
<body>

<!-- ===== PARTICLES ===== -->
<div class="particles" id="particles"></div>

<!-- ===== TOAST ===== -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- ===== PLAYER ===== -->
<div class="player-container">

    <!-- HEADER -->
    <div class="player-header">
        <div class="player-brand">
            <div class="logo"><i class="fas fa-crown"></i></div>
            <div>
                <h1>Aurora<span>Player</span></h1>
                <div style="display:flex;gap:4px;align-items:center;margin-top:-2px;">
                    <span class="version">v2.0</span>
                    <span style="font-size:7px;color:#52525b;">·</span>
                    <span style="font-size:7px;color:#52525b;">HQ Audio</span>
                </div>
            </div>
        </div>
        <div class="player-quality">
            <i class="fas fa-check-circle"></i> 48kHz
        </div>
    </div>

    <!-- UPLOAD ZONE -->
    <div class="upload-zone" id="uploadZone">
        <div class="icon"><i class="fas fa-cloud-arrow-up"></i></div>
        <div class="title"><b>Klik atau tarik</b> file audio</div>
        <div class="sub">MP3, WAV, FLAC, OGG, M4A, AAC, OPUS</div>
        <div class="formats">
            <span>MP3</span>
            <span>WAV</span>
            <span>FLAC</span>
            <span>OGG</span>
            <span>M4A</span>
            <span>AAC</span>
        </div>
    </div>
    <input type="file" id="fileInput" accept=".mp3,.wav,.flac,.ogg,.m4a,.aac,.opus">

    <!-- FILE INFO -->
    <div class="file-info" id="fileInfo">
        <div class="row"><span class="label">📁 File</span><span class="value" id="fileName">-</span></div>
        <div class="row"><span class="label">📦 Ukuran</span><span class="value" id="fileSize">-</span></div>
        <div class="row"><span class="label">⏱️ Durasi</span><span class="value" id="fileDuration">-</span></div>
        <div class="row"><span class="label">🎵 Sample Rate</span><span class="value" id="fileSampleRate">-</span></div>
    </div>

    <!-- COVER ART -->
    <div class="cover-art" id="coverArt">
        <div class="placeholder"><i class="fas fa-music"></i></div>
        <div class="spectrum" id="spectrum"></div>
    </div>

    <!-- SONG INFO -->
    <div class="song-info">
        <div class="title" id="songTitle"><i class="fas fa-music" style="opacity:.2"></i> Belum ada lagu</div>
        <div class="artist" id="songArtist">Upload file audio untuk mulai</div>
        <div class="status-badge" id="statusBadge">● Siap</div>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
        <button class="ctrl-btn" id="prevBtn" disabled><i class="fas fa-backward-step"></i></button>
        <button class="ctrl-btn play-btn" id="playBtn" disabled><i class="fas fa-play" id="playIcon"></i></button>
        <button class="ctrl-btn" id="nextBtn" disabled><i class="fas fa-forward-step"></i></button>
    </div>

    <!-- PROGRESS -->
    <div class="progress-wrap">
        <span class="time" id="currentTime">0:00</span>
        <div class="progress-bar" id="progressBar">
            <div class="fill" id="progressFill"></div>
        </div>
        <span class="time" id="totalTime">0:00</span>
    </div>

    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <div class="volume-wrap">
            <i class="fas fa-volume-low"></i>
            <input type="range" id="volumeSlider" min="0" max="100" value="80">
            <i class="fas fa-volume-high"></i>
        </div>
        <div class="bottom-actions">
            <button class="btn primary" id="convertBtn" onclick="convertToHQ()"><i class="fas fa-magic"></i> HQ</button>
            <button class="btn" onclick="downloadAudio()"><i class="fas fa-download"></i></button>
            <button class="btn danger" onclick="resetPlayer()"><i class="fas fa-trash"></i></button>
        </div>
    </div>

    <!-- STATUS -->
    <div class="status-text" id="statusText">
        <i class="fas fa-circle info"></i> Siap memutar musik kualitas tinggi
    </div>
</div>

<audio id="audioPlayer" style="display:none;"></audio>

<script>
// ============================================================
// IMPORTS
// ============================================================
const { FFmpeg } = FFmpegWASM;
const { toBlobURL, fetchFile } = FFmpegUtil;

// ============================================================
// DOM REFS
// ============================================================
const $ = id => document.getElementById(id);
const uploadZone = $('uploadZone');
const fileInput = $('fileInput');
const fileInfo = $('fileInfo');
const fileName = $('fileName');
const fileSize = $('fileSize');
const fileDuration = $('fileDuration');
const fileSampleRate = $('fileSampleRate');
const coverArt = $('coverArt');
const spectrum = $('spectrum');
const songTitle = $('songTitle');
const songArtist = $('songArtist');
const statusBadge = $('statusBadge');
const playBtn = $('playBtn');
const playIcon = $('playIcon');
const prevBtn = $('prevBtn');
const nextBtn = $('nextBtn');
const progressBar = $('progressBar');
const progressFill = $('progressFill');
const currentTime = $('currentTime');
const totalTime = $('totalTime');
const volumeSlider = $('volumeSlider');
const statusText = $('statusText');
const audioPlayer = $('audioPlayer');

// ============================================================
// STATE
// ============================================================
let currentFile = null;
let currentBlob = null;
let currentUrl = null;
let isPlaying = false;
let isReady = false;
let ffmpeg = null;
let audioFiles = [];
let currentIndex = -1;
let convertQuality = 'hq'; // hq, lossless

// ============================================================
// TOAST
// ============================================================
function toast(msg, type = 'info') {
    const wrap = $('toastWrap');
    const el = document.createElement('div');
    el.className = 'toast-item ' + type;
    const icons = { ok: 'fa-check-circle', err: 'fa-exclamation-circle', info: 'fa-info-circle' };
    el.innerHTML = `<span class="icon"><i class="fas ${icons[type] || icons.info}"></i></span><span>${msg}</span>`;
    wrap.appendChild(el);
    setTimeout(() => { if (el.parentNode) el.remove(); }, 3000);
}

// ============================================================
// PARTICLES
// ============================================================
function createParticles() {
    const container = $('particles');
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = p.style.height = (2 + Math.random() * 4) + 'px';
        p.style.animationDuration = (15 + Math.random() * 25) + 's';
        p.style.animationDelay = (Math.random() * 20) + 's';
        p.style.opacity = 0.1 + Math.random() * 0.3;
        container.appendChild(p);
    }
}
createParticles();

// ============================================================
// SPECTRUM VISUALIZER
// ============================================================
let spectrumBars = [];
let audioContext = null;
let analyser = null;
let dataArray = null;
let animationId = null;

function initSpectrum() {
    const bars = 32;
    spectrum.innerHTML = '';
    for (let i = 0; i < bars; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        bar.style.height = '2px';
        spectrum.appendChild(bar);
        spectrumBars.push(bar);
    }
}

function startSpectrum() {
    if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
        const source = audioContext.createMediaElementSource(audioPlayer);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        dataArray = new Uint8Array(analyser.frequencyBinCount);
    }
    spectrum.classList.add('active');
    animateSpectrum();
}

function animateSpectrum() {
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    const step = Math.floor(dataArray.length / spectrumBars.length);
    for (let i = 0; i < spectrumBars.length; i++) {
        const val = dataArray[i * step] || 0;
        const height = Math.max(2, (val / 255) * 50);
        spectrumBars[i].style.height = height + 'px';
    }
    animationId = requestAnimationFrame(animateSpectrum);
}

function stopSpectrum() {
    spectrum.classList.remove('active');
    if (animationId) {
        cancelAnimationFrame(animationId);
        animationId = null;
    }
    spectrumBars.forEach(bar => bar.style.height = '2px');
}

// ============================================================
// BOOT FFMPEG
// ============================================================
async function bootFFmpeg() {
    setStatus('⏳ Memuat FFmpeg engine...', 'info');
    try {
        ffmpeg = new FFmpeg();
        await ffmpeg.load({
            coreURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.js', 'text/javascript'),
            wasmURL: await toBlobURL('https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm/ffmpeg-core.wasm', 'application/wasm'),
            classWorkerURL: await toBlobURL('https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js', 'text/javascript')
        });
        isReady = true;
        toast('✅ FFmpeg siap!', 'ok');
        setStatus('✅ Siap memproses audio kualitas tinggi', 'ok');
    } catch (e) {
        setStatus('❌ Gagal load FFmpeg: ' + e.message, 'err');
        toast('❌ Gagal load FFmpeg', 'err');
        isReady = false;
    }
}

// ============================================================
// SET STATUS
// ============================================================
function setStatus(msg, type = 'info') {
    const icons = { ok: 'fa-check-circle', err: 'fa-exclamation-circle', info: 'fa-circle' };
    const colors = { ok: 'ok', err: 'err', info: 'info' };
    statusText.innerHTML = `<i class="fas ${icons[type] || icons.info} ${colors[type] || 'info'}"></i> ${msg}`;
}

// ============================================================
// GET AUDIO INFO
// ============================================================
async function getAudioInfo(file) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = await file.arrayBuffer();
        const audioBuffer = await ctx.decodeAudioData(buf);
        await ctx.close();
        return { duration: audioBuffer.duration, sampleRate: audioBuffer.sampleRate };
    } catch (e) {
        return new Promise((resolve) => {
            const url = URL.createObjectURL(file);
            const audio = new Audio();
            audio.preload = 'metadata';
            audio.onloadedmetadata = () => {
                URL.revokeObjectURL(url);
                resolve({ duration: audio.duration || 0, sampleRate: 44100 });
            };
            audio.onerror = () => {
                URL.revokeObjectURL(url);
                resolve({ duration: 0, sampleRate: 44100 });
            };
            setTimeout(() => {
                URL.revokeObjectURL(url);
                resolve({ duration: 0, sampleRate: 44100 });
            }, 5000);
            audio.src = url;
        });
    }
}

// ============================================================
// FORMAT SIZE
// ============================================================
function formatSize(bytes) {
    if (bytes < 1024) return bytes + 'B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + 'KB';
    return (bytes / 1048576).toFixed(1) + 'MB';
}

function formatDuration(sec) {
    sec = Math.floor(sec || 0);
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m + ':' + (s < 10 ? '0' + s : s);
}

// ============================================================
// HANDLE FILE UPLOAD
// ============================================================
async function handleFile(file) {
    const allowed = ['audio/mpeg', 'audio/wav', 'audio/ogg', 'audio/flac', 'audio/mp4', 'audio/aac', 'audio/opus'];
    if (!allowed.includes(file.type) && !file.name.match(/\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i)) {
        toast('Format tidak didukung', 'err');
        return;
    }

    currentFile = file;
    const info = await getAudioInfo(file);

    fileName.textContent = file.name;
    fileSize.textContent = formatSize(file.size);
    fileDuration.textContent = info.duration ? formatDuration(info.duration) : '-';
    fileSampleRate.textContent = info.sampleRate ? info.sampleRate + 'Hz' : '-';
    fileInfo.style.display = 'block';

    songTitle.textContent = file.name.replace(/\.[^.]+$/, '');
    songArtist.textContent = info.sampleRate + 'Hz · ' + formatSize(file.size);

    // Load ke player
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentUrl = URL.createObjectURL(file);
    audioPlayer.src = currentUrl;
    audioPlayer.load();

    // Update UI
    audioFiles = [file];
    currentIndex = 0;
    playBtn.disabled = false;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    statusBadge.textContent = '● Siap putar';
    statusBadge.className = 'status-badge';

    setStatus('🎵 ' + file.name + ' siap diputar', 'ok');
    toast('📁 ' + file.name + ' dimuat', 'ok');

    // Cover art animasi
    const cover = coverArt.querySelector('.placeholder');
    cover.innerHTML = '<i class="fas fa-headphones" style="color:rgba(124,92,255,.3)"></i>';
    cover.style.fontSize = '48px';

    // Bind audio events
    bindAudioEvents();
}

// ============================================================
// AUDIO EVENTS
// ============================================================
function bindAudioEvents() {
    audioPlayer.addEventListener('play', () => {
        isPlaying = true;
        playIcon.className = 'fas fa-pause';
        statusBadge.textContent = '▶️ Sedang diputar';
        statusBadge.className = 'status-badge playing';
        if (!spectrum.classList.contains('active')) {
            initSpectrum();
            startSpectrum();
        }
    });

    audioPlayer.addEventListener('pause', () => {
        isPlaying = false;
        playIcon.className = 'fas fa-play';
        statusBadge.textContent = '⏸️ Dijeda';
        statusBadge.className = 'status-badge';
        if (audioPlayer.currentTime >= audioPlayer.duration - 0.5) {
            statusBadge.textContent = '● Selesai';
        }
    });

    audioPlayer.addEventListener('timeupdate', () => {
        if (audioPlayer.duration) {
            const pct = (audioPlayer.currentTime / audioPlayer.duration) * 100;
            progressFill.style.width = pct + '%';
            currentTime.textContent = formatDuration(audioPlayer.currentTime);
        }
    });

    audioPlayer.addEventListener('loadedmetadata', () => {
        totalTime.textContent = formatDuration(audioPlayer.duration);
        progressFill.style.width = '0%';
        currentTime.textContent = '0:00';
    });

    audioPlayer.addEventListener('ended', () => {
        playIcon.className = 'fas fa-play';
        statusBadge.textContent = '● Selesai';
        statusBadge.className = 'status-badge';
        stopSpectrum();
    });

    // Volume
    volumeSlider.addEventListener('input', () => {
        audioPlayer.volume = volumeSlider.value / 100;
    });
    audioPlayer.volume = volumeSlider.value / 100;

    // Progress click
    progressBar.addEventListener('click', (e) => {
        if (!audioPlayer.duration) return;
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        audioPlayer.currentTime = pct * audioPlayer.duration;
    });
}

// ============================================================
// PLAY/PAUSE
// ============================================================
function togglePlay() {
    if (!audioPlayer.src) return;
    if (audioPlayer.paused) {
        audioPlayer.play().catch(() => {});
    } else {
        audioPlayer.pause();
    }
}

playBtn.addEventListener('click', togglePlay);

// ============================================================
// CONVERT TO HIGH QUALITY (via FFmpeg)
// ============================================================
async function convertToHQ() {
    if (!currentFile) { toast('Upload file dulu', 'info'); return; }
    if (!isReady) { toast('⏳ FFmpeg belum siap', 'info'); return; }
    if (!ffmpeg) { toast('❌ FFmpeg tidak tersedia', 'err'); return; }

    const btn = $('convertBtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Proses...';

    toast('🎛️ Mengonversi ke kualitas tinggi...', 'info');
    setStatus('⏳ Mengonversi audio...', 'info');

    try {
        const inputName = 'input_' + currentFile.name;
        const outputName = 'output_' + Date.now() + '.wav';

        // Baca info
        const info = await getAudioInfo(currentFile);
        const sampleRate = info.sampleRate || 44100;

        // Filter: Normalisasi + Resample ke 48kHz + Limiter
        const filter = `loudnorm=I=-14:TP=-1.5:LRA=11,aresample=48000,alimiter=limit=0.97:attack=5:release=50`;

        await ffmpeg.writeFile(inputName, await fetchFile(currentFile));

        ffmpeg.on('progress', ({ progress }) => {
            const pct = Math.min(100, Math.round(progress * 100));
            setStatus(`⏳ Mengonversi... ${pct}%`, 'info');
        });

        await ffmpeg.exec([
            '-i', inputName,
            '-af', filter,
            '-map_metadata', '-1',
            '-fflags', '+bitexact',
            '-c:a', 'pcm_s16le',
            '-ar', '48000',
            '-y', outputName
        ]);

        const data = await ffmpeg.readFile(outputName);
        const blob = new Blob([data.buffer], { type: 'audio/wav' });

        // Simpan hasil
        currentBlob = blob;
        const url = URL.createObjectURL(blob);

        // Update player dengan hasil convert
        if (currentUrl) URL.revokeObjectURL(currentUrl);
        currentUrl = url;
        audioPlayer.src = url;
        audioPlayer.load();

        // Update info
        const outInfo = await getAudioInfo(blob);
        fileSampleRate.textContent = '48000Hz (HQ)';
        fileDuration.textContent = formatDuration(outInfo.duration);

        songArtist.textContent = '48kHz · WAV · ' + formatSize(blob.size);

        toast('✅ Konversi selesai! Kualitas 48kHz WAV', 'ok');
        setStatus('✅ Konversi selesai! Kualitas tinggi', 'ok');

        // Play hasil
        audioPlayer.play().catch(() => {});

        await ffmpeg.deleteFile(inputName).catch(() => {});
        await ffmpeg.deleteFile(outputName).catch(() => {});

    } catch (e) {
        toast('❌ Gagal konversi: ' + e.message, 'err');
        setStatus('❌ Gagal: ' + e.message, 'err');
        console.error(e);
    }

    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-magic"></i> HQ';
}

// ============================================================
// DOWNLOAD
// ============================================================
function downloadAudio() {
    if (!audioPlayer.src) { toast('Tidak ada audio', 'info'); return; }
    const blob = currentBlob || currentFile;
    if (!blob) { toast('File tidak tersedia', 'err'); return; }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    const name = currentFile ? currentFile.name.replace(/\.[^.]+$/, '') : 'audio';
    a.download = name + (currentBlob ? '_HQ.wav' : '.mp3');
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('⬇ Download dimulai', 'ok');
}

// ============================================================
// RESET
// ============================================================
function resetPlayer() {
    if (!confirm('Reset pemutar?')) return;
    if (currentUrl) URL.revokeObjectURL(currentUrl);
    currentFile = null;
    currentBlob = null;
    currentUrl = null;
    audioFiles = [];
    currentIndex = -1;
    audioPlayer.src = '';
    audioPlayer.load();
    fileInfo.style.display = 'none';
    songTitle.textContent = '🎵 Belum ada lagu';
    songArtist.textContent = 'Upload file audio untuk mulai';
    statusBadge.textContent = '● Siap';
    statusBadge.className = 'status-badge';
    playBtn.disabled = true;
    prevBtn.disabled = true;
    nextBtn.disabled = true;
    playIcon.className = 'fas fa-play';
    progressFill.style.width = '0%';
    currentTime.textContent = '0:00';
    totalTime.textContent = '0:00';
    const cover = coverArt.querySelector('.placeholder');
    cover.innerHTML = '<i class="fas fa-music"></i>';
    cover.style.fontSize = '64px';
    stopSpectrum();
    setStatus('🔄 Reset selesai', 'info');
    toast('🔄 Reset', 'info');
}

// ============================================================
// UPLOAD EVENTS
// ============================================================
uploadZone.addEventListener('click', () => fileInput.click());

uploadZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    uploadZone.classList.add('dragover');
});

uploadZone.addEventListener('dragleave', () => {
    uploadZone.classList.remove('dragover');
});

uploadZone.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        handleFile(e.dataTransfer.files[0]);
    }
});

fileInput.addEventListener('change', () => {
    if (fileInput.files.length) {
        handleFile(fileInput.files[0]);
    }
    fileInput.value = '';
});

// ============================================================
// KEYBOARD SHORTCUTS
// ============================================================
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === ' ' || e.key === 'Space') {
        e.preventDefault();
        togglePlay();
    }
    if (e.key === 'ArrowRight') {
        audioPlayer.currentTime = Math.min(audioPlayer.currentTime + 10, audioPlayer.duration || 0);
    }
    if (e.key === 'ArrowLeft') {
        audioPlayer.currentTime = Math.max(audioPlayer.currentTime - 10, 0);
    }
});

// ============================================================
// INIT SPECTRUM
// ============================================================
initSpectrum();

// ============================================================
// BOOT FFMPEG
// ============================================================
bootFFmpeg();

// ============================================================
// PROTECT REFRESH
// ============================================================
window.addEventListener('beforeunload', (e) => {
    if (currentBlob || currentFile) {
        e.preventDefault();
        e.returnValue = 'Masih ada audio yang diputar. Yakin keluar?';
        return e.returnValue;
    }
});
